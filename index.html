<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="timer">Time Left : <span class="timevalue">0</span> Sec</div>
        <div class="target">Target: <span class="targetvalue">0</span></div>
        <div class="score">Score: <span class="scorevalue">0</span></div>
    </nav>
   <main>
    <div class="game">
        <h1 class="hide">Game Over !</h1>
        <h4>Score : <span class="finalscore">0</span></h4>
        <h4>High Score : <span class="highscore">0</span></h4>
        <button id="start">Start</button>
    </div>
    <div class="numbers">

    </div>
   </main>
    <script src="script.js"></script>
</body>
</html>
